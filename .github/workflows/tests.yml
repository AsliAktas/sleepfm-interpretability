name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs of the same ref (e.g. rapid pushes) to save minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dua-hygiene:
    name: DAUA compliance grep-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grep for real MESA subject IDs (REDACTED-6812 range)
        # NSRR DAUA §5 — no real MESA subject IDs may live in tracked source
        # or reports. Only 9xxx synthetic IDs are allowed (test fixtures).
        # This gate fires if a real ID slips back in.
        run: |
          set +e
          matches=$(git ls-files | while read f; do
            grep -HnoE '\b(REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED)\b' "$f" 2>/dev/null
          done)
          if [ -n "$matches" ]; then
            echo "❌ DAUA violation — real MESA subject IDs found in tracked files:"
            echo "$matches"
            exit 1
          fi
          echo "✅ No real MESA subject IDs in tracked files"

      - name: Confirm DEFAULT_SUBJECTS is empty
        run: |
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from download_nsrr_mesa import DEFAULT_SUBJECTS
          assert DEFAULT_SUBJECTS == (), f'DEFAULT_SUBJECTS must be empty, got: {DEFAULT_SUBJECTS}'
          print('✅ DEFAULT_SUBJECTS is empty')
          "

  pytest:
    name: pytest (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: dua-hygiene  # only run tests once DAUA gate is green

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python --version
          pip list

      - name: Collect tests
        # Fail early if a test module can't be imported — surfaces missing
        # dependencies before we spend minutes running.
        run: python -m pytest tests/ --collect-only -q

      - name: Run tests
        # Tests that need real MESA data (guarded with pytest.mark.skipif on
        # path existence) skip automatically in CI. Everything else must pass.
        run: python -m pytest tests/ -v --tb=short

      - name: Report skipped tests
        if: always()
        run: |
          echo "Skipped tests (expected: real-MESA-XML tests)"
          python -m pytest tests/ -rs -q --no-header || true

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs of the same ref (e.g. rapid pushes) to save minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python --version
          pip list

      - name: Collect tests
        # Fail early if a test module can't be imported — surfaces missing
        # dependencies before we spend minutes running.
        run: python -m pytest tests/ --collect-only -q

      - name: Run tests
        # Tests that need real MESA data (guarded with pytest.mark.skipif on
        # path existence) skip automatically in CI. Everything else must pass.
        run: python -m pytest tests/ -v --tb=short

      - name: Report skipped tests
        if: always()
        run: |
          echo "Skipped tests (expected: real-MESA-XML tests)"
          python -m pytest tests/ -rs -q --no-header || true
